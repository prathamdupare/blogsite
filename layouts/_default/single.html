{{ define "main" }}
<article>
    <header class="post-header">
        <h1>{{ .Title }}</h1>
        {{ if not .Date.IsZero }}<div class="meta">{{ .Date.Format "January 2, 2006" }}{{ with .ReadingTime }} · {{ . }} min read{{ end }}</div>{{ end }}
    </header>

    {{ .Content }}

    {{ with .Params.tags }}
    <div class="tags">
        {{ range . }}<a href="{{ (printf "/tags/%s/" (urlize .)) | relURL }}">#{{ . }}</a> {{ end }}
    </div>
    {{ end }}
</article>
{{ end }}
